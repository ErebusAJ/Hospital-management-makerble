<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Login Portal</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            justify-content: center;
            align-items: center;
        }

        header {
            width: 100%;
            background-color: #0056b3;
            color: white;
            padding: 15px 0;
            text-align: center;
            font-size: 24px;
            position: absolute;
            top: 0;
            left: 0;
        }

        .login-box {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 350px;
            margin-top: 80px;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        .error {
            color: red;
            margin-top: 10px;
            text-align: center;
        }

        .register-link {
            color: grey;
            font-weight: 10;
            display: block;
            text-align: center;
            margin-bottom: 15px;
            text-decoration: none;
        }

        footer {
            width: 100%;
            background-color: #0056b3;
            color: white;
            text-align: center;
            padding: 10px 0;
            position: absolute;
            bottom: 0;
            left: 0;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <header>Hospital Management - Makerble Golang</header>
    <div class="login-box">
        <h2>Login</h2>
        <input type="email" id="email" placeholder="Email" required />
        <input type="password" id="password" placeholder="Password" required />
        <a href="/register" class="register-link">Register here!</a>
        <button onclick="handleLogin()">Login</button>
        <div class="error" id="errorMsg"></div>
    </div>

    <footer>
        © 2025 Aarya Jamwal. All rights reserved.
        <br>
        <i><a href="https://www.linkedin.com/in/aarya-jamwal/" style="color: white;">LinkedIn |</a> <a href="https://github.com/ErebusAJ" style="color: white;">GitHub</a></i>
    </footer>

    <script>
        async function handleLogin() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorBox = document.getElementById('errorMsg');
            errorBox.textContent = "";

            if (!email || !password) {
                errorBox.textContent = "Email and password are required.";
                return;
            }

            try {
                const response = await fetch("{{.addr }}/v1/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    errorBox.textContent = data.message || "Login failed.";
                    return;
                }

                localStorage.setItem("token", data.token);
                localStorage.setItem("role", data.role);
                localStorage.setItem("user_id", data.user_id);

                // Redirect based on role
                if (data.role === "receptionist") {
                    window.location.href = "/receptionist";
                } else if (data.role === "doctor") {
                    window.location.href = "/doctor";
                } else {
                    errorBox.textContent = "Unknown role.";
                }

            } catch (err) {
                console.error(err);
                errorBox.textContent = "An error occurred during login.";
            }
        }

        function handleRegister() {
            window.location.href = "/register";
        }
    </script>

</body>

</html>
